name: Build & Unit Test

on:
  push:
    branches: [master, develop]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - "*" # matches every branch
      - "*/*" # matches every branch containing a single '/'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Scripts Compile
        run: dotnet run --configuration Release --no-build --project AAEmu.Game/AAEmu.Game.csproj compiler-check
      - name: Test
        run: dotnet test --project AAEmu.UnitTests --configuration Release --no-build --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura --results-directory ./TestResults
      - name: Content Studio Tests
        run: dotnet test --project Tools/AAEmu.ContentStudio.Tests --configuration Release --no-build
      - name: Quest sphere audit tests
        run: python3 -m unittest discover -s Tools/tests -p 'test_quest_sphere_audit.py'
      - name: Game MySQL transaction tests
        run: dotnet test --project AAEmu.IntegrationTests --configuration Release --no-build -- --filter-trait Category=GameMySql
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./TestResults/coverage.cobertura.xml
          coverage-reporter-version: v0.6.22
